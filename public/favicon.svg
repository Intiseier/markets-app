<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#252840"/>

  <!-- Arms + body — angular shrug -->
  <path d="M 14 46 L 7 60 L 27 72 Q 50 80 73 72 L 93 60 L 86 46"
        stroke="white" stroke-width="8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eyes -->
  <circle cx="42" cy="34" r="4.5" fill="white"/>
  <circle cx="58" cy="34" r="4.5" fill="white"/>

  <!-- Smile -->
  <path d="M 37.5 42 Q 50 52 62.5 42"
        stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Green candlestick (left) -->
  <line x1="14" y1="26" x2="14" y2="33"
        stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="10.5" y="33" width="7" height="13" rx="1.2" fill="#22c55e"/>
  <line x1="14" y1="46" x2="14" y2="52"
        stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Red candlestick (right) -->
  <line x1="86" y1="26" x2="86" y2="33"
        stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="82.5" y="33" width="7" height="13" rx="1.2" fill="#ef4444"/>
  <line x1="86" y1="46" x2="86" y2="52"
        stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
</svg>
