<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="22" fill="#2d2f3e"/>
  <!-- Left eye -->
  <circle cx="37" cy="38" r="5" fill="white"/>
  <!-- Right eye -->
  <circle cx="63" cy="38" r="5" fill="white"/>
  <!-- Meh mouth (flat line with slight curve) -->
  <path d="M 33 60 Q 50 68 67 60" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Left arm -->
  <path d="M 28 50 L 18 55 L 22 65" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Green candlestick (left hand) -->
  <rect x="13" y="42" width="8" height="11" rx="1.5" fill="#10b981"/>
  <line x1="17" y1="40" x2="17" y2="42" stroke="#10b981" stroke-width="2"/>
  <line x1="17" y1="53" x2="17" y2="55" stroke="#10b981" stroke-width="2"/>
  <!-- Right arm -->
  <path d="M 72 50 L 82 55 L 78 65" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Red candlestick (right hand) -->
  <rect x="79" y="42" width="8" height="11" rx="1.5" fill="#ef4444"/>
  <line x1="83" y1="40" x2="83" y2="42" stroke="#ef4444" stroke-width="2"/>
  <line x1="83" y1="53" x2="83" y2="55" stroke="#ef4444" stroke-width="2"/>
</svg>
